name: split safe
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Actions/Cache/Restore@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
